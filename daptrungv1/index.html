<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Đập Trứng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="topbar">
    <div><h1>🥚 ĐẬP TRỨNG</h1><small id="status">OFFLINE / LOCAL</small></div>
    <div id="roomBadge" class="room-badge hidden"></div>
  </header>

  <section id="home" class="screen">
    <div class="panel">
      <h2>Chọn game</h2>
      <div id="rooms" class="rooms"></div>
      <button id="refreshRooms" class="secondary">Làm mới</button>
    </div>
    <div class="panel join-panel">
      <h2>Tham gia Room</h2>
      <input id="joinCode" maxlength="4" placeholder="Room Code">
      <input id="joinName" maxlength="32" placeholder="Nghệ danh">
      <button id="joinRoom">JOIN ROOM</button>
      <p id="joinMessage" class="message"></p>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="panel">
      <div class="room-head"><div><h2>Lobby</h2><small id="lobbyCode"></small></div><span id="hostLabel"></span></div>
      <div id="players" class="players"></div>
      <button id="startGame">START GAME</button>
      <button id="endLobby" class="danger">END GAME</button>
    </div>
  </section>

  <section id="reveal" class="screen hidden">
    <div class="panel reveal"><h2 id="revealTitle">START REVEAL</h2><div id="revealContent"></div></div>
  </section>

  <section id="playing" class="screen hidden">
    <div id="rates" class="rates"></div>
    <div class="table-wrap"><table id="board"></table></div>
    <div class="personal">
      <div id="egg" class="egg-box">🥚</div>
      <div id="personalInfo"></div>
      <button id="play" disabled>🔨 ĐẬP!</button>
    </div>
    <button id="hostControls" class="host-cog hidden">⚙️</button>
  </section>

  <section id="finished" class="screen hidden">
    <div class="panel winner"><div>🏆</div><strong id="winner"></strong><span>WINNER</span></div>
    <div class="table-wrap"><table id="finalBoard"></table></div>
    <div class="actions"><button id="playAgain">PLAY AGAIN</button><button id="newGame">NEW GAME</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="panel modal-panel"><button id="closeModal" class="modal-close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
